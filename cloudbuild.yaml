steps:
  # Deploy directly to Cloud Run (Cloud Build handles image building automatically)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'personal-investor-assistant'
      - '--source=.'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--timeout=900s'
      - '--min-instances=1'

options:
  logging: CLOUD_LOGGING_ONLY
